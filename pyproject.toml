[project]
name = "groundtime"
version = "0.1.0"
description = "Groundtime: when a flight is delayed, plans each passenger's and crew member's wait with Qloo Taste AI, every pick checked for opening hours, dietary needs and getting to the gate in time. Next.js on Amplify, an MCP server on Bedrock AgentCore, Amazon Nova, DynamoDB and Cognito."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40",
]

[dependency-groups]
dev = [
  "moto[dynamodb]>=5",
  "pytest>=8.0",
  "ruff>=0.6",
]
infra = [
  "aws-cdk-lib>=2.272,<3",
  "constructs>=10,<11",
]
server = [
  "mcp>=1.20,<2",
  "pyjwt[crypto]>=2.10",
]

[tool.uv]
default-groups = ["dev", "infra", "server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

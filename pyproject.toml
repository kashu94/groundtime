[project]
name = "groundtime"
version = "0.1.0"
description = "Groundtime: turns a delay or a long connection into time well spent for passengers and crew, with Qloo Taste AI choosing and a rules engine checking; crew control on AWS (Bedrock, AgentCore, DynamoDB, S3 Vectors) and the Model Context Protocol."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40",
]

[dependency-groups]
dev = [
  "moto[dynamodb]>=5",
  "pytest>=8.0",
  "ruff>=0.6",
]
infra = [
  "aws-cdk-lib>=2.272,<3",
  "constructs>=10,<11",
]
server = [
  "mcp>=1.20,<2",
  "pyjwt[crypto]>=2.10",
]

[tool.uv]
default-groups = ["dev", "infra", "server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["infra"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
